<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Platform - Architecture Viewer</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        window.mermaid = mermaid;
        mermaid.initialize({ 
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            flowchart: {
                useMaxWidth: false,
                htmlLabels: true,
                curve: 'basis'
            },
            themeVariables: {
                darkMode: true,
                primaryColor: '#1f6feb',
                primaryTextColor: '#c9d1d9',
                primaryBorderColor: '#58a6ff',
                lineColor: '#58a6ff',
                secondaryColor: '#21262d',
                tertiaryColor: '#161b22'
            }
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: #161b22;
            border-right: 1px solid #30363d;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #58a6ff;
        }

        .sidebar h2 {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 20px;
        }

        .diagram-list {
            list-style: none;
        }

        .diagram-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 14px;
            border-left: 3px solid transparent;
        }

        .diagram-item:hover {
            background: #21262d;
            border-left-color: #58a6ff;
        }

        .diagram-item.active {
            background: #1f6feb;
            border-left-color: #58a6ff;
            color: white;
        }

        .diagram-number {
            color: #8b949e;
            margin-right: 8px;
            font-weight: bold;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 20px 30px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            color: #58a6ff;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: #30363d;
            border-color: #58a6ff;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: #1f6feb;
            border-color: #1f6feb;
        }

        .btn-primary:hover {
            background: #388bfd;
        }

        /* Diagram Viewer */
        .diagram-viewer {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0d1117;
        }

        .diagram-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: transform 0.1s ease-out;
        }

        .diagram-container.grabbing {
            cursor: grabbing;
        }

        .diagram-content {
            transform-origin: center;
            max-width: 90%;
            max-height: 90%;
        }

        /* Zoom Controls */
        .zoom-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #161b22;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: #30363d;
            color: #58a6ff;
        }

        .zoom-level {
            font-size: 12px;
            text-align: center;
            color: #8b949e;
            padding: 5px;
        }

        /* Fullscreen */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d1117;
            z-index: 1000;
            display: none;
        }

        .fullscreen-overlay.active {
            display: flex;
            flex-direction: column;
        }

        .fullscreen-header {
            padding: 15px 30px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }

        .spinner {
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #161b22;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h1>🏗️ Peer Architecture</h1>
            <h2>Interactive Diagrams</h2>
            <ul class="diagram-list" id="diagramList"></ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1 id="currentDiagramTitle">Complete System Architecture</h1>
                <div class="controls">
                    <button class="btn" onclick="resetView()">
                        <span>↻</span> Reset View
                    </button>
                    <button class="btn" onclick="downloadSVG()">
                        <span>↓</span> Download SVG
                    </button>
                    <button class="btn btn-primary" onclick="toggleFullscreen()">

                    </button>

            </div>

            <div class="diagram-viewer">
                <div class="diagram-container" id="diagramContainer">
                    <div class="diagram-content" id="diagramContent">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>Loading diagram...</p>
                        </div>

                </div>

                <div class="zoom-controls">
                    <button class="zoom-btn" onclick="zoomIn()">+</button>

                    <button class="zoom-btn" onclick="zoomOut()">−</button>
                    <button class="zoom-btn" onclick="resetZoom()">⟲</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <div class="fullscreen-header">
            <h1 id="fullscreenTitle">Diagram</h1>
            <button class="btn" onclick="toggleFullscreen()">
                <span>✕</span> Close
            </button>
        </div>
        <div class="diagram-viewer" style="flex: 1;">
            <div class="diagram-container" id="fullscreenContainer">

            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomIn()">+</button>

                <button class="zoom-btn" onclick="zoomOut()">−</button>
                <button class="zoom-btn" onclick="resetZoom()">⟲</button>
            </div>
        </div>

        let currentDiagram = 0;
        let zoom = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;
        let isFullscreen = false;

        // Initialize
        function init() {
            renderDiagramList();
            loadDiagram(0);
            enablePanZoom();
        }

        function renderDiagramList() {
            const list = document.getElementById('diagramList');
            diagrams.forEach((diagram, index) => {
                const li = document.createElement('li');
                li.className = 'diagram-item' + (index === 0 ? ' active' : '');
                li.innerHTML = `<span class="diagram-number">${index + 1}.</span>${diagram.title}`;
                li.onclick = () => loadDiagram(index);
                list.appendChild(li);
            });
        }

        async function loadDiagram(index) {
            currentDiagram = index;
            const diagram = diagrams[index];
            
            // Update active state
            document.querySelectorAll('.diagram-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });

            // Update title
            document.getElementById('currentDiagramTitle').textContent = diagram.title;
            document.getElementById('fullscreenTitle').textContent = diagram.title;

            // Reset view
            resetView();

            // Render diagram
            const container = isFullscreen ? 
                document.getElementById('fullscreenContent') : 
                document.getElementById('diagramContent');
            
            // Show loading state
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Rendering diagram...</p>
                </div>
            `;
            
            try {
                // Generate unique ID for this render
                const graphId = `mermaid-${Date.now()}-${index}`;
                
                // Render the mermaid diagram
                const { svg } = await window.mermaid.render(graphId, diagram.code);
                
                // Insert the SVG
                container.innerHTML = svg;
                
                // Style the SVG
                const svgElement = container.querySelector('svg');
                if (svgElement) {
                    svgElement.style.maxWidth = '100%';
                    svgElement.style.height = 'auto';
                }
            } catch (error) {
                console.error('Error rendering diagram:', error);
                container.innerHTML = `
                    <div class="loading">
                        <p style="color: #f85149;">Error rendering diagram</p>
                        <p style="font-size: 12px; color: #8b949e;">${error.message}</p>
                    </div>
                `;
            }
        }

        function resetView() {
            zoom = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function zoomIn() {
            zoom = Math.min(zoom * 1.2, 5);
            updateTransform();
        }

        function zoomOut() {
            zoom = Math.max(zoom / 1.2, 0.5);
            updateTransform();
        }

        function resetZoom() {
            zoom = 1;
            updateTransform();
        }

        function updateTransform() {
            const container = isFullscreen ? 
                document.getElementById('fullscreenContainer') : 
                document.getElementById('diagramContainer');
            const content = container.querySelector('.diagram-content');
            
            content.style.transform = `scale(${zoom})`;
            container.style.transform = `translate(${panX}px, ${panY}px)`;
            
            const zoomDisplay = isFullscreen ? 
                document.getElementById('fullscreenZoom') : 
                document.getElementById('zoomLevel');
            zoomDisplay.textContent = Math.round(zoom * 100) + '%';
        }

        function enablePanZoom() {
            [document.getElementById('diagramContainer'), document.getElementById('fullscreenContainer')].forEach(container => {
                container.addEventListener('mousedown', (e) => {
                    if (e.target === container || e.target.classList.contains('diagram-content')) {
                        isDragging = true;
                        startX = e.clientX - panX;
                        startY = e.clientY - panY;
                        container.classList.add('grabbing');
                    }
                });

                container.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        panX = e.clientX - startX;
                        panY = e.clientY - startY;
                        updateTransform();
                    }
                });

                container.addEventListener('mouseup', () => {
                    isDragging = false;
                    container.classList.remove('grabbing');
                });

                container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    if (e.deltaY < 0) {
                        zoomIn();
                    } else {
                        zoomOut();
                    }
                });
            });
        }

        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            const overlay = document.getElementById('fullscreenOverlay');
            overlay.classList.toggle('active');
            
            if (isFullscreen) {
                loadDiagram(currentDiagram);
            }
        }

        function downloadSVG() {
            const container = isFullscreen ? 
                document.getElementById('fullscreenContent') : 
                document.getElementById('diagramContent');
            const svg = container.querySelector('svg');
            
            if (svg) {
                const serializer = new XMLSerializer();
                const svgStr = serializer.serializeToString(svg);
                const blob = new Blob([svgStr], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${diagrams[currentDiagram].title.replace(/\s+/g, '_')}.svg`;
                a.click();
                URL.revokeObjectURL(url);
            } else {
                console.error('No SVG found to download');
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentDiagram < diagrams.length - 1) {
                loadDiagram(currentDiagram + 1);
            } else if (e.key === 'ArrowLeft' && currentDiagram > 0) {
                loadDiagram(currentDiagram - 1);
            } else if (e.key === 'f') {
                toggleFullscreen();
            } else if (e.key === 'r') {
                resetView();
            } else if (e.key === 'Escape' && isFullscreen) {
                toggleFullscreen();
            }
        });

        // Start
        init();
    </script>
</body>
</html>
